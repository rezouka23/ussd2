<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Flouci Payment</title>
</head>

<body style="font-family:'Tajawal','Segoe UI',sans-serif; background:#050505; margin:0; padding:12px; text-align:center; color:#f5f5f5; min-height:100vh; box-sizing:border-box;">

  <div style="max-width:380px; width:100%; margin:auto; background:#121212; padding:18px 16px 20px; border-radius:16px; box-shadow:0 6px 20px rgba(0,0,0,0.65); border:1px solid #1f1f1f; box-sizing:border-box;">

    <!-- UPDATED LOGO -->
    <div style="display:flex; align-items:center; justify-content:center; margin-bottom:12px;">
      <img src="https://i.ibb.co/hxD9tc5h/11-12.png"
           alt="Flouci Logo"
           style="max-width:110px; width:100%; height:auto; display:block;">
    </div>

    <!-- INSTRUCTIONS -->
    <p style="direction:rtl; text-align:right; background:rgba(255,138,60,0.08); padding:10px; border-radius:8px; font-size:14px; line-height:1.6; border:1px solid rgba(255,138,60,0.35); margin:0; box-sizing:border-box; word-wrap:break-word;">
      لِإتمام عملية الإيداع عبر Flouci:
      انسخ الرقم، افتح تطبيق Flouci، اضغط على <strong>Envoyer / ابعَث</strong>، ضع الرقم في خانة <strong>Recherche</strong>، اختر المستلم ثم أرسل المبلغ.
      بعد الإرسال، التقط لقطة شاشة وأرسلها للدعم.
    </p>

    <!-- WARNING BOX -->
    <div style="background:rgba(255,196,138,0.07); color:#ffb45c; border:1px solid rgba(255,196,138,0.6); padding:10px; border-radius:8px; margin-top:12px; direction:rtl; text-align:right; font-size:13px; line-height:1.6; box-sizing:border-box; word-wrap:break-word;">
      ⚠️ يرجى التأكد من تطابق الاسم الظاهر في Flouci مع الاسم الذي نعطيه لك.
    </div>

    <!-- COPY BUTTON ONLY -->
    <button id="copyNumero"
            style="display:block; width:100%; background:linear-gradient(135deg,#ff8a3c,#ffb35f); color:#111; border:none; padding:12px; border-radius:10px; font-size:15px; margin-top:18px; cursor:pointer; font-weight:600; touch-action:manipulation; box-sizing:border-box;">
      نسخ الرقم
    </button>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const numero = params.get('numero') || '';

    async function copyAndChange(buttonId, value, originalText, successText) {
      const btn = document.getElementById(buttonId);
      let copySuccess = false;

      // Universal clipboard method - works on all browsers and environments
      const textArea = document.createElement('textarea');
      textArea.value = value || '';
      textArea.style.position = 'fixed';
      textArea.style.left = '-9999px';
      textArea.style.top = '0';
      textArea.style.opacity = '0';
      textArea.setAttribute('readonly', '');
      document.body.appendChild(textArea);

      // Focus and select
      textArea.focus();
      textArea.select();
      textArea.setSelectionRange(0, 99999);

      // Try execCommand first (works on most mobile browsers and WebViews)
      try {
        copySuccess = document.execCommand('copy');
      } catch (err) {
        copySuccess = false;
      }

      // If execCommand failed, try modern clipboard API
      if (!copySuccess && navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(value || '');
          copySuccess = true;
        } catch (err) {
          copySuccess = false;
        }
      }

      // Remove textarea immediately
      document.body.removeChild(textArea);

      // Update button state
      if (copySuccess) {
        btn.textContent = successText;
        btn.disabled = true;
        btn.style.opacity = "0.85";
        setTimeout(() => {
          btn.textContent = originalText;
          btn.disabled = false;
          btn.style.opacity = "1";
        }, 1400);
      } else {
        alert('فشل النسخ. يرجى المحاولة مرة أخرى');
      }
    }

    document.getElementById('copyNumero').onclick = () =>
      copyAndChange('copyNumero', numero, 'نسخ الرقم', 'تم النسخ ✓');
  </script>

</body>
</html>
