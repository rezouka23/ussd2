<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D17 Payment</title>
</head>
<body style="font-family:'Tajawal','Segoe UI',sans-serif; background:radial-gradient(circle at top,#214366 0,#030913 60%); color:#f5f9ff; margin:0; padding:20px; text-align:center; min-height:100vh; box-sizing:border-box;">

  <div style="max-width:520px; width:100%; margin:auto; background:#06111f; padding:24px 20px 26px; border-radius:18px; box-shadow:0 10px 35px rgba(0,0,0,0.8); border:1px solid rgba(0,123,200,0.55); box-sizing:border-box;">

    <!-- LOGO -->
    <div style="display:flex; align-items:center; justify-content:center; margin-bottom:16px;">
      <img src="https://i.ibb.co/DHwcy0m6/d17.png"
           alt="D17 Logo"
           style="max-width:180px; width:100%; height:auto; display:block;">
    </div>

    <!-- MAIN TEXT -->
    <p style="direction:rtl; text-align:right; background:rgba(0,114,188,0.09); padding:12px; border-radius:10px; font-size:15px; line-height:1.7; border:1px solid rgba(0,114,188,0.55); color:#f4f8ff; margin:0; box-sizing:border-box; word-wrap:break-word;">
      🏦 لِإتمام عملية الإيداع عبر تطبيق D17: انسخ الرقم الذي نعطيك إياه، ثم افتح تطبيق D17 على هاتفك. اختر Transfert d'argent، ضع الرقم في خانة المستلم وأدخل المبلغ الذي تريد إرساله. بعد الإرسال، خذ لقطة شاشة وأرسلها لفريق الدفع لاستكمال الإيداع.
    </p>

    <!-- COPY BUTTON -->
    <button id="copyNumero"
            style="display:block; width:100%; background:linear-gradient(135deg,#0072bc,#23a1ff); color:#ffffff; border:none; padding:12px; border-radius:10px; font-size:16px; margin-top:22px; cursor:pointer; font-weight:600; box-sizing:border-box; touch-action:manipulation;">
      نسخ الرقم
    </button>

  </div>

  <script>
    const paramsD = new URLSearchParams(window.location.search);
    const numeroD = paramsD.get('numero') || '';

    async function copyAndChange(buttonId, value, originalText, successText) {
      const btn = document.getElementById(buttonId);
      let copySuccess = false;

      // Universal clipboard method - works on all browsers and environments
      const textArea = document.createElement('textarea');
      textArea.value = value || '';
      textArea.style.position = 'fixed';
      textArea.style.left = '-9999px';
      textArea.style.top = '0';
      textArea.style.opacity = '0';
      textArea.setAttribute('readonly', '');
      document.body.appendChild(textArea);

      // Focus and select
      textArea.focus();
      textArea.select();
      textArea.setSelectionRange(0, 99999);

      // Try execCommand first (works on most mobile browsers and WebViews)
      try {
        copySuccess = document.execCommand('copy');
      } catch (err) {
        copySuccess = false;
      }

      // If execCommand failed, try modern clipboard API
      if (!copySuccess && navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(value || '');
          copySuccess = true;
        } catch (err) {
          copySuccess = false;
        }
      }

      // Remove textarea immediately
      document.body.removeChild(textArea);

      // Update button state
      if (copySuccess) {
        btn.textContent = successText;
        btn.disabled = true;
        btn.style.opacity = '0.85';
        setTimeout(() => {
          btn.textContent = originalText;
          btn.disabled = false;
          btn.style.opacity = '1';
        }, 1500);
      } else {
        alert('فشل النسخ. يرجى المحاولة مرة أخرى');
      }
    }

    document.getElementById('copyNumero').onclick = () =>
      copyAndChange('copyNumero', numeroD, 'نسخ الرقم', 'تم النسخ ✓');
  </script>

</body>
</html>
