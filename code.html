<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bénéficiaire</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #f8f9fc;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 480px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    h2 {
      margin-bottom: 15px;
    }
    .attention {
      background-color: #fff4e5;
      color: #b45b00;
      border: 1px solid #ffc107;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      direction: rtl;
      text-align: right;
      font-size: 14px;
    }
    .btn {
      display: block;
      width: 100%;
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #0056b3;
    }
    .tutorial-btn {
      background-color: #28a745;
    }
    .tutorial-btn:hover {
      background-color: #1f7e32;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      text-align: left;
    }
    .wallet-image {
      width: 100%;
      max-width: 360px;
      margin: 15px auto;
      border-radius: 10px;
      display: block;
    }

    /* Overlay modal styles */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .overlay-content {
      position: relative;
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .overlay-content img {
      width: 100%;
      height: auto;
      display: block;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 26px;
      color: white;
      cursor: pointer;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.2s;
    }
    .close-btn:hover {
      background: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>IZI PAYMENT</h2>
    <div class="attention">
      ⚠️ تنبيه: يرجى اختيار نوع المحفظة (Wallet) عند إدخال الرقم. في حال إدخال الرقم في الخانة الخاطئة سيتم فقدان الإيداع نهائياً.
    </div>

    <div>
      <label>Prénom</label>
      <button class="btn" id="copyPrenom">Copier le prénom</button>

      <label>Nom</label>
      <button class="btn" id="copyNom">Copier le nom</button>

      <label>Numéro de téléphone</label>
      <button class="btn" id="copyNumero">Copier le numéro</button>

    </div>

    <button class="btn tutorial-btn" id="openTutorial">🎬 Voir le tutoriel</button>
  </div>

  <!-- Overlay Modal -->
  <div class="overlay" id="tutorialOverlay">
    <div class="overlay-content">
      <span class="close-btn" id="closeOverlay">&times;</span>
      <img src="https://i.imgur.com/K60ys18.mp4" alt="Tutoriel GIF">
    </div>
  </div>

  <script>
    // Copy buttons
    const params = new URLSearchParams(window.location.search);
    const nom = params.get('nom') || 'Nom non défini';
    const prenom = params.get('prenom') || 'Prénom non défini';
    const numero = params.get('numero') || 'Numéro non défini';

    document.getElementById('copyPrenom').onclick = () => copyValue(prenom, 'le prénom');
    document.getElementById('copyNom').onclick = () => copyValue(nom, 'le nom');
    document.getElementById('copyNumero').onclick = () => copyValue(numero, 'le numéro');

    function copyValue(value, label) {
      navigator.clipboard.writeText(value)
        .then(() => alert(`${label} "${value}" copié avec succès !`))
        .catch(err => alert("Erreur de copie : " + err));
    }

    // Overlay logic
    const overlay = document.getElementById('tutorialOverlay');
    const openBtn = document.getElementById('openTutorial');
    const closeBtn = document.getElementById('closeOverlay');

    openBtn.addEventListener('click', () => overlay.style.display = 'flex');
    closeBtn.addEventListener('click', () => overlay.style.display = 'none');
    overlay.addEventListener('click', e => {
      if (e.target === overlay) overlay.style.display = 'none';
    });
  </script>
</body>
</html>
