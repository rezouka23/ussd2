<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نسخ الرقم</title>
  <style>
    body {
      font-family: "Tajawal", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f3f3f3;
    }
    .container {
      background: #fff;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .instructions {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #333;
    }
    button {
      background: #17A926;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #138f20;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="instructions">اضغط على الزر لنسخ الرقم</div>
    <button onclick="copyCode()">نسخ الرقم</button>
  </div>

  <script>
    // Get the code from URL parameter (?code=...)
    const urlParams = new URLSearchParams(window.location.search);
    const codeParam = urlParams.get('code');

    function copyCode() {
      if (codeParam) {
        navigator.clipboard.writeText(codeParam).then(() => {
          alert('تم نسخ الرقم بنجاح: ' + codeParam);
        });
      } else {
        alert('لم يتم العثور على رقم في الرابط.');
      }
    }
  </script>
</body>
</html>
