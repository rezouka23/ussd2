<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bénéficiaire</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #f8f9fc;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 480px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    h2 {
      margin-bottom: 15px;
    }
    .attention {
      background-color: #fff4e5;
      color: #b45b00;
      border: 1px solid #ffc107;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      direction: rtl;
      text-align: right;
      font-size: 14px;
    }
    .btn {
      display: block;
      width: 100%;
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #0056b3;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      text-align: left;
    }
    .wallet-image {
      width: 100%;
      max-width: 360px;
      margin: 15px auto;
      border-radius: 10px;
      display: block;
    }
    .tutorial-gif {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>IZI PAYMENT</h2>
    <div class="attention">
      ⚠️ تنبيه: يرجى اختيار نوع المحفظة (Wallet) عند إدخال الرقم. في حال إدخال الرقم في الخانة الخاطئة سيتم فقدان الإيداع نهائياً.
    </div>

    <div>
      <label>Prénom</label>
      <button class="btn" id="copyPrenom">Copier le prénom</button>

      <label>Nom</label>
      <button class="btn" id="copyNom">Copier le nom</button>

      <label>Numéro Wallet</label>
      <button class="btn" id="copyNumero">Copier le numéro</button>

    </div>

    <img class="tutorial-gif" src="https://i.imgur.com/FcqzFVT.gif" alt="Tutoriel GIF">
  </div>

  <script>
    // Get query parameters
    const params = new URLSearchParams(window.location.search);
    const nom = params.get('nom') || 'Nom non défini';
    const prenom = params.get('prenom') || 'Prénom non défini';
    const numero = params.get('numero') || 'Numéro non défini';

    // Copy functions
    document.getElementById('copyPrenom').onclick = () => copyValue(prenom, 'le prénom');
    document.getElementById('copyNom').onclick = () => copyValue(nom, 'le nom');
    document.getElementById('copyNumero').onclick = () => copyValue(numero, 'le numéro');

    function copyValue(value, label) {
      navigator.clipboard.writeText(value)
        .then(() => alert(`${label} "${value}" copié avec succès !`))
        .catch(err => alert("Erreur de copie : " + err));
    }
  </script>
</body>
</html>
