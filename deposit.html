<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>طرق الإيداع</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    body {
        background: #0d0d0d;
        margin: 0;
        padding: 25px;
        font-family: "Tajawal", Arial, sans-serif;
        color: white;
        text-align: center;
    }

    .platform-logo {
        width: 130px;
        margin: 0 auto 30px auto;
        display: block;
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.25));
    }

    .container {
        max-width: 500px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 22px;
    }

    .method-box {
        background: linear-gradient(145deg, #161616, #0d0d0d);
        border-radius: 18px;
        padding: 22px;
        display: flex;
        align-items: center;
        gap: 20px;
        text-decoration: none;
        border: 1px solid #222;
        transition: 0.25s ease;
    }

    .method-box:hover {
        transform: translateY(-3px);
        background: #191919;
        border-color: #2e2e2e;
    }

    .method-box img {
        width: 70px;
        height: 70px;
        object-fit: contain;
    }

    .method-label {
        font-size: 22px;
        font-weight: 600;
        text-align: right;
    }

</style>
</head>
<body>

<!-- Platform Logo -->
<img class="platform-logo" 
     src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSve2NEp5rwlbYx-C3LdtgaiOyO-wpWrTy89w&s" 
     alt="شعار المنصة">

<div class="container">

    <!-- Flouci -->
    <a class="method-box" href="https://direct.lc.chat/15545109/8" target="_blank">
        <img src="https://i.imgur.com/kcwIX6k.png" alt="شعار فلوسي">
        <div class="method-label" style="color:#00d17d;">الإيداع عبر فلوسي</div>
    </a>

    <!-- D17 -->
    <a class="method-box" href="https://direct.lc.chat/15545109/8" target="_blank">
        <img src="https://i.imgur.com/VmIQLez.png" alt="شعار D17">
        <div class="method-label" style="color:#4ca3ff;">الإيداع عبر D17</div>
    </a>

</div>

</body>
</html>
